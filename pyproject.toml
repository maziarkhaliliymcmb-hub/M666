[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m666-interactions"
version = "1.0.0"
description = "Sparse symmetric interaction matrix for the M36 genome."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "m666*"]
exclude = ["tests*"]
