name: Python tests and package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and build frontend
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt
      - name: Validate pinned cross-repository interoperability fixture
        run: python scripts/validate_interop_fixture.py
      - name: Run test suite
        run: python -m pytest -q
      - name: Build wheel
        run: python -m build --wheel
