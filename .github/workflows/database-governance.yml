name: 36OS Database Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-governance:
    name: database-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate database-first change records
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse "$HEAD_SHA^")"
          fi
          python scripts/validate_change_records.py "$BASE" "$HEAD_SHA"
      - name: Validate canonical JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("data/36os").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("All canonical JSON files parse successfully.")
          PY
